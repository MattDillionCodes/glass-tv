# Push a tag like v1.0.0 -> build the signed release APK -> publish a GitHub Release with
#   glass-tv.apk          (same name every release, so .../releases/latest/download/glass-tv.apk works)
#   glass-tv.apk.sha256   ("<sha256>  glass-tv.apk", for the MDS TV UIs site's install prompt to verify)
# and the release notes from that version's section of CHANGELOG.md.
#
# Repo secrets (Settings -> Secrets and variables -> Actions), set by setup-signing-key:
#   MDS_KEYSTORE_BASE64, MDS_KEYSTORE_PASSWORD, MDS_KEY_ALIAS, MDS_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check the tag matches versionName
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "$want" != "$have" ]; then echo "Tag $GITHUB_REF_NAME but versionName is $have"; exit 1; fi

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MDS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MDS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MDS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MDS_KEY_PASSWORD }}
        run: |
          # Never publish a debug-signed build: stop if the key isn't set up.
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MDS_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          umask 077
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          # Glass reads its key settings from ~/.android-keys/glass-release.properties
          mkdir -p "$HOME/.android-keys" && cp keystore.properties "$HOME/.android-keys/glass-release.properties"
      - name: Build
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Check it's signed with the release key
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Built $APK"
          keytool -printcert -jarfile "$APK" | tee cert.txt
          grep -q "Matt Dillion Shoots" cert.txt || { echo "Not signed with the MDS release key"; exit 1; }
          cp "$APK" glass-tv.apk

      - name: Checksum and notes
        run: |
          sha256sum glass-tv.apk > glass-tv.apk.sha256
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" glass-tv.apk glass-tv.apk.sha256 --title "Glass $GITHUB_REF_NAME" --notes-file notes.md

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties "$HOME/.android-keys/glass-release.properties"
